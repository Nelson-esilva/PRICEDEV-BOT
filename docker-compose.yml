services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pricedev
      POSTGRES_PASSWORD: pricedev
      POSTGRES_DB: pricedev
    ports:
      - "5432:5432"
    volumes:
      - pricedev_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pricedev -d pricedev"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://pricedev:pricedev@postgres:5432/pricedev
      ENABLE_SCHEDULER: "true"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pricedev_pg:
