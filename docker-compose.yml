name: pricedev

services:
  postgres:
    container_name: pricedev-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pricedev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pricedev}
      POSTGRES_DB: pricedev
    volumes:
      - pricedev_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pricedev -d pricedev"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    container_name: pricedev-backend
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://pricedev:${POSTGRES_PASSWORD:-pricedev}@postgres:5432/pricedev
      ENABLE_SCHEDULER: "true"
      TELEGRAM_SESSION_PATH: /var/lib/pricedev/telegram_inbox.session
      PRICEDEV_DATA_DIR: /var/lib/pricedev/data
    volumes:
      - pricedev_runtime:/var/lib/pricedev
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"

  frontend:
    container_name: pricedev-frontend
    build:
      context: ./frontend
    ports:
      - "${PRICEDEV_UI_PORT:-5173}:80"
    depends_on:
      - backend

volumes:
  pricedev_pg:
  pricedev_runtime:
